[mod-name]
Nightfall=Nightfall

[mod-description]
Nightfall=Night that is worth lighting. Unlit ground goes genuinely dark and moonlight turns cold and blue, with a brief warm lift through dawn and dusk, so lamps become something you build because you need them rather than because they look nice. Nauvis only by default, and every change it makes can be handed back.

[mod-setting-name]
nightfall-enabled=Enable Nightfall
nightfall-surfaces=Surfaces affected
nightfall-night-brightness=Darkness of night
nightfall-cool-strength=Coolness of moonlight
nightfall-golden-hour=Golden hour
nightfall-golden-strength=Strength of golden hour
nightfall-solar-multiplier=Solar power multiplier

[mod-setting-description]
nightfall-enabled=Turn this off to hand every surface straight back to the lighting it had before Nightfall touched it. Do this before removing the mod: the properties it changes are stored in the save, so a mod that is simply deleted leaves its darkness behind.
nightfall-surfaces=Comma-separated surface names. Defaults to Nauvis alone, because every planet in Space Age has its own lighting character and its own day length, and restyling Fulgora without being asked is not a favour. Use * for every surface. Space platforms are always skipped. Blank means none.
nightfall-night-brightness=How dark unlit ground is allowed to get. The engine default is 0.15; 0.05 is dark enough that lamps matter and you can still find your way. 0 is pitch black and genuinely hard to play. Note that this also feeds solar output and biter spawn rates, not only what you see.
nightfall-cool-strength=How far the colour is pushed toward blue as night falls. 0 leaves the colour alone and only the darkness changes; 1 reads as moonlight. Noon is untouched at any setting.
nightfall-golden-hour=A brief warm lift through dawn and dusk, instead of the light sliding straight from neutral day to cold night. Costs nothing and is the difference between a sunset and a dimmer switch.
nightfall-golden-strength=How warm dawn and dusk get. Only used when Golden hour is on.
nightfall-solar-multiplier=Compensation for the solar output that darker nights cost you, if you would rather not have the lighting change your power balance. 1.0 leaves solar exactly as the game set it and Nightfall does not touch the property at all.
